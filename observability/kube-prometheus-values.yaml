prometheus:
  prometheusSpec:
    scrapeInterval: "1s"

    additionalScrapeConfigs:
      - job_name: inference-router
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: inference-router

      - job_name: vllm
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: vllm

grafana:
  enabled: true
  adminPassword: admin

alertmanager:
  enabled: false

nodeExporter:
  enabled: false

kubeStateMetrics:
  enabled: false