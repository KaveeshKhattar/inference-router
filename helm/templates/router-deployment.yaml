apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-router
spec:
  replicas: {{ .Values.router.replicas }}
  selector:
    matchLabels:
      app: inference-router
  template:
    metadata:
      labels:
        app: inference-router
    spec:
      containers:
      - name: router
        image: {{ .Values.router.image }}
        imagePullPolicy: Never
        ports:
        - containerPort: 9000
        env:
        - name: VLLM_DISCOVERY_HOST
          value: {{ .Values.router.discoveryHost }}