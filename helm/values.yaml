router:
  replicas: 1
  image: llm-router:rr-13-apr
  servicePort: 9000
  discoveryHost: vllm-headless.default.svc.cluster.local
  pdEnabled: false
  prefillDiscoveryHost: vllm-prefill-headless.default.svc.cluster.local
  decodeDiscoveryHost: vllm-decode-headless.default.svc.cluster.local

disaggregation:
  enabled: false

vllmPrefill:
  replicas: 2
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.0
  model: meta-llama/Llama-3.1-8B-Instruct
  port: 8000
  maxNumSeqs: 8
  maxQueueLength: 500
  maxModelLen: 4096
  prefillOverhead: 25ms
  prefillTimePerToken: 2ms
  prefillTimePerTokenStdDev: 0.05ms
  timeFactorUnderLoad: 1.5

vllmDecode:
  replicas: 2
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.0
  model: meta-llama/Llama-3.1-8B-Instruct
  port: 8000
  maxNumSeqs: 8
  maxQueueLength: 500
  maxModelLen: 4096
  interTokenLatency: 15ms
  interTokenLatencyStdDev: 3ms
  kvCacheTransferTimePerToken: 0.2ms
  kvCacheTransferTimeStdDev: 0.02ms
  timeFactorUnderLoad: 1.5

vllm:
  replicas: 2
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.0
  model: meta-llama/Llama-3.1-8B-Instruct
  port: 8000
  serviceType: NodePort

  maxNumSeqs: 8
  maxQueueLength: 500
  maxModelLen: 4096

  prefillOverhead: 25ms
  prefillTimePerToken: 0.5ms
  prefillTimePerTokenStdDev: 0.01ms
  interTokenLatency: 15ms
  interTokenLatencyStdDev: 3ms
  timeFactorUnderLoad: 1.5

  