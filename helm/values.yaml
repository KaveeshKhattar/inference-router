router:
  replicas: 1
  image: llm-router:rr-13-apr
  servicePort: 9000
  discoveryHost: vllm-headless.default.svc.cluster.local

vllm:
  replicas: 2
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.0
  model: meta-llama/Llama-3.1-8B-Instruct
  port: 8000
  serviceType: NodePort

  maxNumSeqs: 8
  maxQueueLength: 500
  maxModelLen: 4096

  prefillOverhead: 25ms
  prefillTimePerToken: 0.5ms
  prefillTimePerTokenStdDev: 0.01ms
  interTokenLatency: 15ms
  interTokenLatencyStdDev: 3ms
  timeFactorUnderLoad: 1.5

  