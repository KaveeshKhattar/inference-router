apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-prefill
  labels:
    app: vllm-prefill
    llm-d.ai/role: prefill
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-prefill
      llm-d.ai/role: prefill
  template:
    metadata:
      labels:
        app: vllm-prefill
        llm-d.ai/role: prefill
    spec:
      containers:
      - name: simulator
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.0
        args:
          - "--model"
          - "meta-llama/Llama-3.1-8B-Instruct"
          - "--port"
          - "8000"
          - "--max-num-seqs"
          - "8"
          - "--max-waiting-queue-length"
          - "500"
          - "--max-model-len"
          - "4096"
          - "--prefill-overhead"
          - "25ms"
          - "--prefill-time-per-token"
          - "2ms"
          - "--prefill-time-std-dev"
          - "0.05ms"
          - "--time-factor-under-load"
          - "1.5"
        ports:
        - containerPort: 8000
          name: http
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
