apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-router
  template:
    metadata:
      labels:
        app: inference-router
    spec:
      containers:
      - name: router
        image: llm-router:local
        imagePullPolicy: Never
        ports:
        - containerPort: 9000
        env:
        - name: ROUTER_PD_ENABLED
          value: "1"
        - name: ROUTER_STRATEGY
          value: cache-aware
        - name: VLLM_PREFILL_DISCOVERY_HOST
          value: vllm-prefill-headless.default.svc.cluster.local
        - name: VLLM_DECODE_DISCOVERY_HOST
          value: vllm-decode-headless.default.svc.cluster.local
