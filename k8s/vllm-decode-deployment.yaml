apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-decode
  labels:
    app: vllm-decode
    llm-d.ai/role: decode
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-decode
      llm-d.ai/role: decode
  template:
    metadata:
      labels:
        app: vllm-decode
        llm-d.ai/role: decode
    spec:
      containers:
      - name: simulator
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.0
        args:
          - "--model"
          - "meta-llama/Llama-3.1-8B-Instruct"
          - "--port"
          - "8000"
          - "--max-num-seqs"
          - "8"
          - "--max-waiting-queue-length"
          - "500"
          - "--max-model-len"
          - "4096"
          - "--inter-token-latency"
          - "15ms"
          - "--inter-token-latency-std-dev"
          - "3ms"
          - "--kv-cache-transfer-time-per-token"
          - "0.2ms"
          - "--kv-cache-transfer-time-std-dev"
          - "0.02ms"
          - "--time-factor-under-load"
          - "1.5"
        ports:
        - containerPort: 8000
          name: http
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
